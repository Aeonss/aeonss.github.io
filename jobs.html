<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job searching...</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;900&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Barlow", "sans-serif"],
              display: ["Barlow Condensed", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="jobs.css" />
    <script src="navbar.js"></script>
  </head>

  <body>
    <site-navbar></site-navbar>

    <!-- SEARCH -->
    <!-- search-wrap: pt-[60px] px-8 max-w-[860px] mx-auto -->
    <div class="pt-[60px] px-8 max-w-[860px] mx-auto mt-8">
      <!-- search-row: flex gap-2.5 -->
      <div class="flex gap-2.5">
        <input
          id="searchInput"
          class="search-input flex-1 text-[15px] px-[18px] py-3 rounded"
          type="text"
          value=""
          placeholder="e.g. Project Accountant, Software Engineer…"
        />
        <button
          id="searchBtn"
          class="search-btn font-display text-[15px] font-semibold tracking-[0.12em] uppercase px-8 py-3 rounded border-none text-white cursor-pointer whitespace-nowrap"
          onclick="doSearch()"
        >
          Search
        </button>
      </div>
    </div>

    <!-- CACHE TOOLBAR -->
    <!-- cache-toolbar: max-w-[860px] mx-auto mt-2.5 px-8 flex items-center gap-2 flex-wrap -->
    <div
      class="max-w-[860px] mx-auto mt-2.5 px-8 flex items-center gap-2 flex-wrap"
    >
      <span
        id="cacheStat"
        class="cache-stat font-mono text-[10px] text-[color:var(--text3)] flex-1"
      >
        Cache: loading…
      </span>
      <button
        class="cache-btn font-mono text-[10px] tracking-[0.08em] uppercase px-3 py-[5px] rounded-[3px] cursor-pointer"
        onclick="exportCache()"
      >
        ⬆️ Export Cache
      </button>
      <label
        class="cache-btn font-mono text-[10px] tracking-[0.08em] uppercase px-3 py-[5px] rounded-[3px] cursor-pointer"
      >
        ⬇️ Import Cache
        <input
          type="file"
          accept=".json"
          class="hidden"
          onchange="importCache(event)"
        />
      </label>
      <button
        class="cache-btn danger font-mono text-[10px] tracking-[0.08em] uppercase px-3 py-[5px] rounded-[3px] cursor-pointer"
        onclick="loadCurrentCache()"
      >
        ⚡ Load Cache
      </button>
      <button
        class="cache-btn danger font-mono text-[10px] tracking-[0.08em] uppercase px-3 py-[5px] rounded-[3px] cursor-pointer"
        onclick="clearCache()"
      >
        ❌ Clear Cache
      </button>
    </div>

    <!-- ERROR BOX -->
    <div
      id="errorBox"
      class="error-box font-mono text-[11.5px] px-4 py-2.5 rounded mx-8 mt-3"
    ></div>

    <!-- META BAR -->
    <!-- meta-bar: flex items-center gap-2 px-8 pt-4 pb-2 font-mono text-[11px] text-[color:var(--text3)] min-h-[46px] -->
    <div
      class="flex items-center gap-2 px-8 pt-4 pb-2 font-mono text-[11px] text-[color:var(--text3)] min-h-[46px]"
    >
      <div id="loader" class="meta-dots-loader" style="display: none">
        <span></span><span></span><span></span>
        <span class="ml-1 font-mono text-[11px] text-[color:var(--text3)]"
          >Fetching jobs…</span
        >
      </div>
      <span id="metaText" style="display: none"></span>
    </div>

    <!-- JOBS GRID -->
    <main>
      <!-- jobs-grid: px-8 pb-20 grid gap-3 auto-fill minmax(320px,1fr) -->
      <div
        id="jobsGrid"
        class="px-8 pb-20 grid gap-3"
        style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr))"
      >
        <!-- empty state -->
        <div class="col-span-full text-center py-20 text-[color:var(--text3)]">
          <div class="text-[44px] mb-4 inline-block animate-bounce">🔍</div>
          <div
            class="font-display text-[28px] font-semibold tracking-[0.08em] uppercase text-[color:var(--text2)] mb-1.5"
          >
            Ready to Search...
          </div>
        </div>
      </div>
    </main>

        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ2ZXIiOjEsImp0aSI6ImIzY2M1MmM4LWFjNTQtNGM4MS1hMjVmLTM0YWU3N2Q0YWNhOSIsImNyZWF0ZWRfYnkiOjE2NzMwMiwicGVybWlzc2lvbnMiOltdLCJhdWQiOiJhcGkiLCJpYXQiOjE3Nzg1MDg4MTYsInN1YiI6IjE2NjU5OCIsIm5hbWUiOiJhc2Rhc2QiLCJlbWFpbCI6ImhveHl5dXRmQG1pY3Jvc2xvcC5hc2lhIn0.aJHguSQU3Xt8OenYzhLXMmfM-JHDAj8kvUXaR3Io2OE",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ2ZXIiOjEsImp0aSI6IjAzM2Y0ZGEwLWU4ZTYtNDU3MC05ZGE1LTQ2Y2JiNDgxMWY2MiIsImNyZWF0ZWRfYnkiOjE2NzMwMywicGVybWlzc2lvbnMiOltdLCJhdWQiOiJhcGkiLCJpYXQiOjE3Nzg1MDg5MjEsInN1YiI6IjE2NjU5OSIsIm5hbWUiOiJzZGRzc2QiLCJlbWFpbCI6Im9yNHMwb2JyQHQub21teC5uZXQifQ.DNhbpQcQp0njIMtRiKO64mN9vRpXRXf5H8tRmxatd0w",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ2ZXIiOjEsImp0aSI6ImU5OTBkYzA2LTYxMzUtNGZlYS04YzFiLTgyZDZmNjI4ZDVmNiIsImNyZWF0ZWRfYnkiOjE2NzQ0MywicGVybWlzc2lvbnMiOltdLCJhdWQiOiJhcGkiLCJpYXQiOjE3Nzg1Mjk0MzEsInN1YiI6IjE2NjczMyIsIm5hbWUiOiJhc2Rhc2QiLCJlbWFpbCI6IjNuZjg3enpmQHNwYW1tYWlsLm9yZyJ9.zrKgrGGpphTEV6HSARkx8I4juPDynW6wEjzrjgWeqFs",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ2ZXIiOjEsImp0aSI6IjA5NDRhMGU4LTE4ZjItNDQ1NC04NmYxLWZmNTA2ZWQ3MDU2OCIsImNyZWF0ZWRfYnkiOjE2NzQ4OSwicGVybWlzc2lvbnMiOltdLCJhdWQiOiJhcGkiLCJpYXQiOjE3Nzg1NTAwNTAsInN1YiI6IjE2Njc3OCIsIm5hbWUiOiJhc2Rhc2QiLCJlbWFpbCI6ImF3ZTlwbXQ4QHNwYW1tYWlsLm9yZyJ9.A1SmIw1eST1OWimEDa3JHJUj4Bmgb2Sc_A65cvBzxYY",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ2ZXIiOjEsImp0aSI6IjFkNjcwMzE1LTE1YjgtNDJlZS04OWJhLWJlNWMzMmRiMGJhNyIsImNyZWF0ZWRfYnkiOjE3MDMwMCwicGVybWlzc2lvbnMiOltdLCJhdWQiOiJhcGkiLCJpYXQiOjE3Nzg4NzM0MDUsInN1YiI6IjE2OTU4NiIsIm5hbWUiOiJhc2FzZGRzYSIsImVtYWlsIjoiOTJreThlOWxAbWljcm9zbG9wLmFzaWEifQ.3xXAvTIZPyUb4f7SdPrAVgdMh3lt5Q5FnbG7pW5ehQM",
      ];
      const API_KEY = API_KEYS[Math.floor(Math.random() * API_KEYS.length)];

      // ─── CACHE ───────────────────────────────────────────────────────────────
      const CACHE_KEY = "jobsCache_v1";

      function loadCache() {
        try {
          return JSON.parse(localStorage.getItem(CACHE_KEY) || "{}");
        } catch {
          return {};
        }
      }
      function saveCache(data) {
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        } catch (e) {
          console.warn("localStorage quota hit, trimming cache…", e);
          for (const k of Object.keys(data)) {
            if (data[k].length > 50) data[k] = data[k].slice(-50);
          }
          try {
            localStorage.setItem(CACHE_KEY, JSON.stringify(data));
          } catch {}
        }
      }
      function getCacheForSearch(searchName) {
        const raw = loadCache();
        const key = searchName.toLowerCase().trim();
        const cachedJobs = raw[key] || [];
        return { cachedJobs, cachedIds: cachedJobs.map((j) => String(j.id)) };
      }
      function addToCache(searchName, jobs) {
        const raw = loadCache();
        const key = searchName.toLowerCase().trim();
        const existing = new Set((raw[key] || []).map((j) => String(j.id)));
        const merged = [...(raw[key] || [])];
        for (const job of jobs) {
          const id = String(job.id);
          if (!existing.has(id)) {
            merged.push(job);
            existing.add(id);
          }
        }
        raw[key] = merged;
        saveCache(raw);
      }
      function updateCacheStat() {
        const raw = loadCache();
        const keys = Object.keys(raw);
        const total = keys.reduce((s, k) => s + raw[k].length, 0);
        const stat = document.getElementById("cacheStat");
        if (!keys.length) {
          stat.innerHTML = "Cache: <strong>empty</strong>";
        } else {
          const searches = keys
            .map((k) => `<em>${k}</em> (${raw[k].length})`)
            .join(", ");
          stat.innerHTML = `Cache: <strong>${total}</strong> jobs — ${searches}`;
        }
      }
      function exportCache() {
        const data = loadCache();
        const blob = new Blob([JSON.stringify(data, null, 2)], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "jobs-cache.json";
        a.click();
        URL.revokeObjectURL(a.href);
      }
      function importCache(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (typeof parsed !== "object" || Array.isArray(parsed))
              throw new Error("Bad format");
            saveCache(parsed);
            updateCacheStat();
            // Auto-render all cached jobs grouped by search term
            renderAllCached(parsed);
          } catch (err) {
            alert("Failed to import cache: " + err.message);
          }
        };
        reader.readAsText(file);
        event.target.value = "";
      }
      function loadCurrentCache() {
        try {
          const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}");
          renderAllCached(cache);
        } catch (err) {
          alert("Failed to load cache: " + err.message);
        }
      }

      function renderAllCached(cacheData) {
        const grid = document.getElementById("jobsGrid");
        const metaText = document.getElementById("metaText");
        const errorBox = document.getElementById("errorBox");

        errorBox.style.display = "none";
        const keys = Object.keys(cacheData);
        if (!keys.length) return;

        const total = keys.reduce((s, k) => s + cacheData[k].length, 0);
        metaText.innerHTML = `Showing <strong style="color:var(--text)">${total}</strong> cached jobs across <strong style="color:var(--text)">${keys.length}</strong> search${keys.length !== 1 ? "es" : ""}`;
        metaText.style.display = "inline";

        let html = "";
        let idx = 0;
        for (const key of keys) {
          const jobs = cacheData[key];
          if (!jobs.length) continue;
          html += renderSectionDivider(
            `${key} (cached)`,
            jobs.length,
            "var(--text3)",
          );
          for (const job of jobs) html += renderCard(job, idx++, false);
        }
        grid.innerHTML = html;
      }
      function clearCache() {
        if (!confirm("Clear all cached jobs? This cannot be undone.")) return;
        localStorage.removeItem(CACHE_KEY);
        updateCacheStat();
        // Reset grid to empty state
        document.getElementById("metaText").style.display = "none";
        document.getElementById("metaText").innerHTML = "";
        document.getElementById("jobsGrid").innerHTML = `
          <div class="col-span-full text-center py-20 text-[color:var(--text3)]">
            <div class="text-[44px] mb-4 inline-block">🔍</div>
            <div class="font-display text-[28px] font-semibold tracking-[0.08em] uppercase text-[color:var(--text2)] mb-1.5">Ready to Search...</div>
          </div>`;
      }

      // ─── HELPERS ─────────────────────────────────────────────────────────────
      document
        .getElementById("searchInput")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") doSearch();
        });

      const daysAgo = (d) => {
        if (!d) return null;
        const n = Math.floor((Date.now() - new Date(d)) / 86400000);
        return n === 0 ? "Today" : n === 1 ? "Yesterday" : `${n}d ago`;
      };
      const fmtSalary = (mn, mx) => {
        const f = (n) => (n >= 1000 ? `$${(n / 1000).toFixed(0)}k` : `$${n}`);
        if (mn && mx) return `${f(mn)} – ${f(mx)}`;
        if (mn) return `${f(mn)}+`;
        if (mx) return `Up to ${f(mx)}`;
        return null;
      };
      const SENIORITY_MAP = {
        mid_level: "Mid Level",
        senior: "Senior",
        junior: "Junior",
        entry_level: "Entry",
        lead: "Lead",
        director: "Director",
        manager: "Manager",
        vp: "VP",
        c_level: "C-Level",
      };
      const SENIORITY_CLS = {
        Senior: "badge-senior",
        Lead: "badge-senior",
        Director: "badge-manager",
        "C-Level": "badge-manager",
        VP: "badge-manager",
        "Mid Level": "badge-mid",
        Junior: "badge-junior",
        Entry: "badge-junior",
        Manager: "badge-manager",
      };

      const badge = (label, cls) =>
        `<span class="badge ${cls} text-[9.5px] tracking-[0.1em] uppercase px-[7px] py-[3px] rounded-[3px]">${label}</span>`;
      const workBadge = (job) => {
        if (job.remote) return badge("Remote", "badge-remote");
        if (job.hybrid) return badge("Hybrid", "badge-hybrid");
        return badge("On-site", "badge-onsite");
      };
      const senBadge = (raw) => {
        const label =
          SENIORITY_MAP[raw] || (raw ? raw.replace(/_/g, " ") : null);
        if (!label) return "";
        const cls = SENIORITY_CLS[label] || "badge-generic";
        return badge(label, cls);
      };
      const descToHtml = (t) => {
        if (!t) return "";
        return t
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(
            /^#{1,3} (.+)$/gm,
            '<strong class="block mt-3 mb-1">$1</strong>',
          )
          .replace(/^[-•] (.+)$/gm, "<li>$1</li>")
          .replace(/(<li>[^]*?<\/li>\n?)+/g, (s) => `<ul>${s}</ul>`)
          .replace(/\n{2,}/g, "</p><p>")
          .replace(/\n/g, " ")
          .replace(/^/, "<p>")
          .replace(/$/, "</p>");
      };

      function renderCard(job, i, isNew) {
        const salary = fmtSalary(job.min_annual_salary, job.max_annual_salary);
        const posted = daysAgo(job.date_posted);
        const url = job.url || job.source_url || "#";
        const delay = Math.min(i * 40, 400);
        const logo = job.company_object?.logo;
        const init = (job.company || "?")[0].toUpperCase();
        // card-logo: w-10 h-10 rounded-md flex-shrink-0 object-contain p-1
        // card-logo-fallback: w-10 h-10 rounded-md flex-shrink-0 flex items-center justify-center font-display text-lg font-semibold
        const logoHtml = logo
          ? `<img src="${logo}" alt="" class="card-logo w-10 h-10 rounded-md flex-shrink-0 object-contain p-1" onerror="this.outerHTML='<div class=\\'card-logo-fallback w-10 h-10 rounded-md flex-shrink-0 flex items-center justify-center font-display text-lg font-semibold\\'>${init}</div>'">`
          : `<div class="card-logo-fallback w-10 h-10 rounded-md flex-shrink-0 flex items-center justify-center font-display text-lg font-semibold">${init}</div>`;
        const descHtml = descToHtml(job.description);
        const id = `c${i}`;
        const eBadges = (job.employment_statuses || [])
          .map((s) => badge(s.replace(/_/g, " "), "badge-generic"))
          .join("");
        const newnessBadge = isNew
          ? badge("New", "badge-new")
          : badge("Seen", "badge-cached");
        const cachedClass = isNew ? "" : " is-cached";

        return `
<div class="job-card${cachedClass} rounded-md flex flex-col overflow-hidden" style="animation-delay:${delay}ms">
  <div class="card-topbar"></div>
  <div class="p-5 flex flex-col gap-3.5 flex-1">

    <!-- logo row -->
    <div class="flex items-start justify-between gap-2.5">
      ${logoHtml}
      <div class="flex flex-wrap gap-[5px] justify-end">
        ${newnessBadge}
        ${workBadge(job)}
      </div>
    </div>

    <!-- title + company -->
    <div>
      <div class="text-[14.5px] font-semibold leading-[1.35] text-[color:var(--text)]">${job.job_title || "Untitled Role"}</div>
      <div class="card-company text-[13px] font-medium mt-0.5">${job.company || "Unknown"}</div>
    </div>

    <!-- seniority + employment badges -->
    <div class="flex flex-wrap gap-[5px]">${senBadge(job.seniority)}${eBadges}</div>

    <!-- meta -->
    <div class="flex flex-col gap-[5px] text-[12.5px] text-[color:var(--text2)]">
      ${job.long_location || job.location ? `<div class="flex items-center gap-[7px]"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="opacity-45 flex-shrink-0"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${job.long_location || job.location}</div>` : ""}
      ${job.company_object?.industry ? `<div class="flex items-center gap-[7px]"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="opacity-45 flex-shrink-0"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>${job.company_object.industry}</div>` : ""}
      ${salary ? `<div class="card-salary flex items-center gap-[7px]"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="opacity-45 flex-shrink-0"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>${salary}</div>` : ""}
    </div>

    <!-- description toggle -->
    ${
      descHtml
        ? `
    <div class="desc-toggle-wrap pt-3">
      <button class="desc-toggle-btn flex items-center gap-1.5 font-mono text-[9.5px] tracking-[0.12em] uppercase" onclick="toggleDesc('${id}')">
        <svg id="chev-${id}" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        <span id="lbl-${id}">Show Description</span>
      </button>
      <div id="wrap-${id}" class="desc-wrap">
        <div>
          <div class="desc-body text-[12px] leading-[1.7] text-[color:var(--text2)] pt-3">${descHtml}</div>
        </div>
      </div>
    </div>`
        : ""
    }

  </div>

  <!-- footer -->
  <div class="card-footer px-5 py-3 flex items-center justify-between">
    <span class="card-date font-mono text-[10.5px]">${posted || job.date_posted || "—"}</span>
    <a href="${url}" target="_blank" rel="noopener" class="card-link font-mono text-[10.5px] tracking-[0.08em] uppercase">View Posting →</a>
  </div>
</div>`;
      }

      function renderSectionDivider(label, count, color) {
        return `<div class="col-span-full flex items-center gap-3 py-2">
          <span class="section-divider-label font-mono text-[10px] tracking-[0.15em] uppercase whitespace-nowrap" style="color:${color}">${label} <span class="opacity-50">(${count})</span></span>
          <div class="section-divider-line"></div>
        </div>`;
      }

      function toggleDesc(id) {
        const wrap = document.getElementById(`wrap-${id}`);
        const chev = document.getElementById(`chev-${id}`);
        const lbl = document.getElementById(`lbl-${id}`);
        const open = wrap.classList.contains("open");
        wrap.classList.toggle("open", !open);
        chev.style.transform = open ? "" : "rotate(180deg)";
        lbl.textContent = open ? "Show Description" : "Hide Description";
      }

      // ─── SEARCH ──────────────────────────────────────────────────────────────
      async function doSearch() {
        const query = document.getElementById("searchInput").value.trim();
        if (!query) return;

        const btn = document.getElementById("searchBtn");
        const grid = document.getElementById("jobsGrid");
        const loader = document.getElementById("loader");
        const metaText = document.getElementById("metaText");
        const errorBox = document.getElementById("errorBox");

        btn.disabled = true;
        loader.style.display = "flex";
        metaText.style.display = "none";
        errorBox.style.display = "none";
        grid.innerHTML = "";

        const { cachedJobs, cachedIds } = getCacheForSearch(query);

        try {
          const body = {
            page: 0,
            limit: 25,
            job_title_or: [query],
            job_location_or: [{ id: 6254928 }],
            job_seniority_or: ["junior", "mid_level"],
            posted_at_max_age_days: 30,
            company_country_code_or: ["US"],
          };
          if (cachedIds.length > 0) body.job_id_not = cachedIds;

          const res = await fetch("https://api.theirstack.com/v1/jobs/search", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${API_KEY}`,
            },
            body: JSON.stringify(body),
          });

          if (!res.ok) {
            const e = await res.json().catch(() => ({}));
            throw new Error(e.message || `HTTP ${res.status}`);
          }

          const json = await res.json();
          const newJobs = json.data || [];
          if (newJobs.length > 0) addToCache(query, newJobs);

          loader.style.display = "none";
          metaText.style.display = "inline";

          if (!newJobs.length && !cachedJobs.length) {
            metaText.innerHTML = `No results for <strong style="color:var(--text)">"${query}"</strong>`;
            grid.innerHTML = `<div class="col-span-full text-center py-20 text-[color:var(--text3)]">
              <div class="text-[44px] mb-4 inline-block">🕳️</div>
              <div class="font-display text-[28px] font-semibold tracking-[0.08em] uppercase text-[color:var(--text2)] mb-1.5">No Jobs Found</div>
              <div class="text-[13px]">Try a different title or broaden your search.</div>
            </div>`;
            updateCacheStat();
            return;
          }

          const parts = [];
          if (newJobs.length)
            parts.push(
              `<span style="color:#5fe8a0;font-weight:600">${newJobs.length} new</span>`,
            );
          if (cachedJobs.length)
            parts.push(
              `<span style="color:var(--text3)">${cachedJobs.length} previously seen</span>`,
            );
          metaText.innerHTML = `${parts.join(' <span style="margin:0 4px;color:var(--border)">+</span> ')}
            <span style="margin:0 6px;color:var(--border)">·</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:11px">for <strong style="color:var(--text)">"${query}"</strong></span>`;

          let html = "";
          let idx = 0;
          if (newJobs.length > 0) {
            html += renderSectionDivider(
              "New Listings",
              newJobs.length,
              "#5fe8a0",
            );
            for (const job of newJobs) html += renderCard(job, idx++, true);
          }
          if (cachedJobs.length > 0) {
            html += renderSectionDivider(
              "Previously Seen",
              cachedJobs.length,
              "var(--text3)",
            );
            for (const job of cachedJobs) html += renderCard(job, idx++, false);
          }
          grid.innerHTML = html;
          updateCacheStat();
        } catch (err) {
          loader.style.display = "none";
          errorBox.textContent = `Error: ${err.message}`;
          errorBox.style.display = "block";
          grid.innerHTML = `<div class="col-span-full text-center py-20 text-[color:var(--text3)]">
            <div class="text-[44px] mb-4 inline-block">⚠️</div>
            <div class="font-display text-[28px] font-semibold tracking-[0.08em] uppercase text-[color:var(--text2)] mb-1.5">Something Went Wrong</div>
            <div class="text-[13px]">Check your API key or network and try again.</div>
          </div>`;
        } finally {
          btn.disabled = false;
        }
      }

      updateCacheStat();
    </script>
  </body>
</html>
